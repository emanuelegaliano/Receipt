name: receipt_app
description: "On-device receipt scanner and expense tracker for Android."
publish_to: 'none'
version: 0.3.5+7

environment:
  sdk: ^3.13.7

dependencies:
  archive: ^4.6.0
  crypto: ^3.0.8
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  file_picker: ^13.3.1
  fl_chart: ^1.3.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_onnxruntime: ^1.9.0
  flutter_secure_storage: ^11.2.0
  image: ^4.12.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  sqlite3: ^3.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/models/
    - assets/parser/
    - assets/art/

# Il database è cifrato (vedi lib/security/vault.dart): al posto di SQLite
# normale si usa SQLite3MultipleCiphers, che accetta PRAGMA key.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
