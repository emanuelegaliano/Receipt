name: Release APK and deploy website

# On every push to main:
#   1. if pubspec.yaml has a version without a release yet, build the signed
#      APK and publish it as receipt.apk in the GitHub Release v<version>;
#   2. build site/ and deploy it to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-and-pages
  cancel-in-progress: false

jobs:
  apk:
    name: Signed APK release
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to release
        id: plan
        run: |
          version=$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::Signing secrets are missing: the APK is not built."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists: nothing to publish."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing v$version."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.plan.outputs.release == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - if: steps.plan.outputs.release == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Tests
        if: steps.plan.outputs.release == 'true'
        run: |
          flutter pub get
          flutter test

      - name: Signing key
        if: steps.plan.outputs.release == 'true'
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/receipt-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/receipt-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=receipt"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > android/key.properties

      - name: Build APK
        if: steps.plan.outputs.release == 'true'
        run: |
          flutter build apk --release --target-platform android-arm64 2>&1 | tee build.log
          # Never publish an APK signed with the debug key.
          if grep -q "key.properties mancante" build.log; then
            echo "::error::The APK was signed with the debug key."
            exit 1
          fi
          cp build/app/outputs/flutter-apk/app-release.apk receipt.apk

      - name: Publish release
        if: steps.plan.outputs.release == 'true'
        run: |
          version="${{ steps.plan.outputs.version }}"
          # The short "what's new" lines (whatsnew/<version>.json, English) go
          # on top of the generated notes.
          notes=""
          if [ -f "whatsnew/$version.json" ]; then
            notes=$(jq -r '.en // [] | map("- " + .) | join("\n")' "whatsnew/$version.json")
          fi
          gh release create "v$version" receipt.apk \
            --title "Receipt v$version" \
            --target "$GITHUB_SHA" \
            --notes "$notes" \
            --generate-notes

      - name: Remove signing key
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/receipt-release.jks"

  site:
    name: Build website
    needs: apk
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      # version.json is what the app (lib/update/) reads to offer updates. It
      # describes the release actually published, not pubspec.yaml: a failed
      # APK build must never announce a version that cannot be downloaded.
      - name: version.json from the latest release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            echo "No release yet: no version.json."
            exit 0
          fi
          jq '{version: (.tag_name | ltrimstr("v")), published: .published_at,
               apk: (first(.assets[] | select(.name == "receipt.apk"))
                     | {url: .browser_download_url, size: .size, sha256: ((.digest // "") | ltrimstr("sha256:"))})}' \
            "$RUNNER_TEMP/release.json" > "$RUNNER_TEMP/version.json"
          if [ "$(jq -r '.apk.sha256 // ""' "$RUNNER_TEMP/version.json")" = "" ] && [ "$(jq -r '.apk.url // ""' "$RUNNER_TEMP/version.json")" != "" ]; then
            # Older releases have no digest from GitHub: hash the APK ourselves.
            sha=$(curl -fsSL "$(jq -r .apk.url "$RUNNER_TEMP/version.json")" | sha256sum | cut -d' ' -f1)
            jq --arg sha "$sha" '.apk.sha256 = $sha' "$RUNNER_TEMP/version.json" > "$RUNNER_TEMP/v.json"
            mv "$RUNNER_TEMP/v.json" "$RUNNER_TEMP/version.json"
          fi
          # The "what's new" lines of that version, shown by the app before
          # downloading (whatsnew/<version>.json, optional).
          notes="whatsnew/$(jq -r .version "$RUNNER_TEMP/version.json").json"
          if [ -f "$notes" ] && jq -e 'type == "object"' "$notes" >/dev/null; then
            jq --slurpfile n "$notes" '.notes = $n[0]' "$RUNNER_TEMP/version.json" > "$RUNNER_TEMP/v.json"
            mv "$RUNNER_TEMP/v.json" "$RUNNER_TEMP/version.json"
          fi
          if jq -e '(.apk.sha256 | test("^[0-9a-f]{64}$")) and (.apk.url | startswith("https://"))' "$RUNNER_TEMP/version.json" >/dev/null; then
            cp "$RUNNER_TEMP/version.json" site/public/version.json
            cat site/public/version.json
          else
            echo "::warning::The latest release has no usable receipt.apk: no version.json."
          fi

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
